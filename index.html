<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Simon's</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
</head>

<body>
  <header class="top-title">
    <h1>Simon's</h1>
    <h2>The official website of Simon.</h2>
  </header>
  <main>
    <section class="container-of-link-boxes">


      <a class="main-link-box">
        <div class="main-link-box-div">
          <img src="images/mini index icons/codeberge.png" alt="image of codeberge website logo">
          <div>
            <h3>My codeberge</h3>
            <p>Here I have many of my coding projects</p>
          </div>
        </div>
      </a>


      <a class="main-link-box">
        <div class="main-link-box-div">
          <img src="images/mini index icons/itch.png" alt="image of codeberge website logo">
          <div>
            <h3>My Itch.io</h3>
            <p>Here I host most of my games</p>
          </div>
        </div>
      </a>


    </section>
  </main>
</body>

</html>
